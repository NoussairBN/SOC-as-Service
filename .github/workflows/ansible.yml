name: "⚙️ Ansible — Configure SOC Stack"

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ansible:
    name: "Run Ansible Playbook"
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository (public, no token needed)
        run: git clone https://github.com/${{ github.repository }}.git .

      - name: Install Ansible
        run: pip install ansible

      - name: Setup SSH Key and Config
        run: |
          mkdir -p ~/.ssh

          # Ecrire la cle privee en supprimant les CRLF Windows
          printf '%s' "${{ secrets.EC2_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/pfs-soc-key
          chmod 600 ~/.ssh/pfs-soc-key
          ssh-keygen -l -f ~/.ssh/pfs-soc-key

          # SSH config : cle explicite pour CHAQUE hop (bastion + prives)
          cat > ~/.ssh/config << 'EOF'
          Host bastion
            HostName 32.194.75.46
            User ubuntu
            IdentityFile ~/.ssh/pfs-soc-key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30

          Host 10.0.*.*
            User ubuntu
            IdentityFile ~/.ssh/pfs-soc-key
            ProxyJump bastion
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null

          Host 10.1.*.*
            User ubuntu
            IdentityFile ~/.ssh/pfs-soc-key
            ProxyJump bastion
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

          # Test connexion bastion
          echo "=== Test SSH Bastion ==="
          ssh bastion 'echo BASTION_OK && hostname && uptime'

      - name: Write Ansible Inventory
        run: |
          cat > ansible/inventory/hosts.yml << 'EOF'
          all:
            vars:
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/pfs-soc-key
              ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
            children:
              soc:
                hosts:
                  wazuh-server:
                    ansible_host: 10.1.1.109
              client:
                hosts:
                  dvwa:
                    ansible_host: 10.0.2.206
                  metasploitable:
                    ansible_host: 10.0.2.141
          EOF
          cat ansible/inventory/hosts.yml

      - name: Run Ansible Playbook
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_STDOUT_CALLBACK: "ansible.builtin.default"
          ANSIBLE_RESULT_FORMAT: "yaml"
        run: |
          ansible-playbook site.yml \
            -i inventory/hosts.yml \
            -v \
            --timeout 900
