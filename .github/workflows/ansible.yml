name: "⚙️ Ansible — Configure SOC Stack"

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ansible:
    name: "Run Ansible Playbook"
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository (public, no token needed)
        run: |
          git clone https://github.com/${{ github.repository }}.git .

      - name: Install Ansible
        run: pip install ansible

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/pfs-soc-key
          chmod 600 ~/.ssh/pfs-soc-key
          ssh-keygen -l -f ~/.ssh/pfs-soc-key

      - name: Write Ansible Inventory
        run: |
          cat > ansible/inventory/hosts.yml << 'EOF'
          all:
            vars:
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/pfs-soc-key
            children:
              soc:
                hosts:
                  wazuh-server:
                    ansible_host: 10.1.1.109
                    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyJump=ubuntu@32.194.75.46"
              client:
                hosts:
                  dvwa:
                    ansible_host: 10.0.2.206
                    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyJump=ubuntu@32.194.75.46"
                  metasploitable:
                    ansible_host: 10.0.2.141
                    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyJump=ubuntu@32.194.75.46"
          EOF

      - name: Test SSH connectivity to Bastion
        run: |
          ssh -i ~/.ssh/pfs-soc-key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              ubuntu@32.194.75.46 "echo 'Bastion reachable OK'"

      - name: Run Ansible Playbook
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_STDOUT_CALLBACK: "ansible.builtin.default"
          ANSIBLE_RESULT_FORMAT: "yaml"
        run: |
          ansible-playbook site.yml \
            -i inventory/hosts.yml \
            -v \
            --timeout 900
