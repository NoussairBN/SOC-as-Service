name: "Deploy SOC Infrastructure"

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "ansible/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform (plan / apply / destroy)"
        required: true
        default: "apply"
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: us-east-1

permissions:
  contents: read

jobs:
  # ============================================================
  # JOB 1 - Shift-Left Security Scan
  # Analyse statique de l'IaC avant tout deploiement.
  # Checkov et Trivy detectent les mauvaises configurations
  # Terraform (CRITICAL/HIGH) sans bloquer le pipeline (soft-fail).
  # ============================================================
  security-scan:
    name: "Security Scan (Checkov + Trivy)"
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        run: git clone https://github.com/${{ github.repository }}.git .

      - name: Run Checkov (IaC security analysis)
        run: |
          pip install checkov
          checkov -d terraform/ --soft-fail || true

      - name: Run Trivy (IaC vulnerability scan)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy config terraform/ --exit-code 0 --severity HIGH,CRITICAL || true

  # ============================================================
  # JOB 2 - Terraform Provisioning
  # Deploie ou detruit l'infrastructure AWS (VPCs, subnets,
  # instances EC2, Security Groups, VPC Peering, S3 backend).
  # Les IPs des instances sont exportees vers le job Ansible.
  # ============================================================
  terraform:
    name: "Terraform ${{ github.event.inputs.action || 'apply' }}"
    runs-on: ubuntu-latest
    needs: security-scan
    outputs:
      bastion_ip:    ${{ steps.outputs.outputs.bastion_ip }}
      wazuh_priv_ip: ${{ steps.outputs.outputs.wazuh_priv_ip }}
      dvwa_ip:       ${{ steps.outputs.outputs.dvwa_ip }}
      meta_ip:       ${{ steps.outputs.outputs.meta_ip }}
      wazuh_pub_ip:  ${{ steps.outputs.outputs.wazuh_pub_ip }}

    steps:
      - name: Clone repository
        run: git clone https://github.com/${{ github.repository }}.git .

      - name: Configure AWS credentials
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws configure set aws_access_key_id     "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set region                "$AWS_REGION"
          aws sts get-caller-identity

      - name: Install Terraform 1.11.4
        run: |
          curl -fsSL https://releases.hashicorp.com/terraform/1.11.4/terraform_1.11.4_linux_amd64.zip \
            -o /tmp/tf.zip
          unzip -o /tmp/tf.zip -d /tmp/tf_bin
          sudo mv -f /tmp/tf_bin/terraform /usr/local/bin/terraform
          terraform version

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -var="my_public_ip=0.0.0.0/0" \
            -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.action != 'plan' && github.event.inputs.action != 'destroy'
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: terraform
        run: |
          terraform destroy -auto-approve \
            -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -var="my_public_ip=0.0.0.0/0"

      - name: Extract instance IP addresses from Terraform outputs
        id: outputs
        if: github.event.inputs.action != 'destroy' && github.event.inputs.action != 'plan'
        working-directory: terraform
        run: |
          echo "bastion_ip=$(terraform output -raw bastion_public_ip)"        >> $GITHUB_OUTPUT
          echo "wazuh_pub_ip=$(terraform output -raw wazuh_public_ip)"        >> $GITHUB_OUTPUT
          echo "wazuh_priv_ip=$(terraform output -raw wazuh_private_ip)"      >> $GITHUB_OUTPUT
          echo "dvwa_ip=$(terraform output -raw dvwa_private_ip)"             >> $GITHUB_OUTPUT
          echo "meta_ip=$(terraform output -raw metasploitable_private_ip)"   >> $GITHUB_OUTPUT
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # ============================================================
  # JOB 3 - Ansible Configuration
  # Configure toutes les instances via SSH (ProxyJump via Bastion).
  # Ordre : Wazuh Server -> DVWA -> Agents Wazuh.
  # Le manager doit etre operationnel avant l'enregistrement
  # des agents.
  # ============================================================
  ansible:
    name: "Ansible - Configure SOC"
    runs-on: ubuntu-latest
    needs: terraform
    if: |
      needs.terraform.result == 'success' &&
      github.event.inputs.action != 'destroy' &&
      github.event.inputs.action != 'plan'

    steps:
      - name: Clone repository
        run: git clone https://github.com/${{ github.repository }}.git .

      - name: Install Ansible and dependencies
        run: pip install ansible passlib

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/pfs-soc-key
          chmod 600 ~/.ssh/pfs-soc-key

      - name: Generate SSH config and Ansible inventory
        run: |
          BASTION="${{ needs.terraform.outputs.bastion_ip }}"
          WAZUH_PRIV="${{ needs.terraform.outputs.wazuh_priv_ip }}"
          DVWA="${{ needs.terraform.outputs.dvwa_ip }}"
          META="${{ needs.terraform.outputs.meta_ip }}"

          cat > ~/.ssh/config << EOF
          Host bastion
            HostName ${BASTION}
            User ubuntu
            IdentityFile ~/.ssh/pfs-soc-key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30

          Host 10.0.*.*
            User ubuntu
            IdentityFile ~/.ssh/pfs-soc-key
            ProxyJump bastion
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null

          Host 10.1.*.*
            User ubuntu
            IdentityFile ~/.ssh/pfs-soc-key
            ProxyJump bastion
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

          ssh bastion 'echo "Bastion reachable: $(hostname)"'

          cat > ansible/inventory/hosts.yml << EOF
          all:
            vars:
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/pfs-soc-key
              ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
            children:
              soc:
                vars:
                  wazuh_manager_ip: ${WAZUH_PRIV}
                hosts:
                  wazuh-server:
                    ansible_host: ${WAZUH_PRIV}
              client:
                vars:
                  wazuh_manager_ip: ${WAZUH_PRIV}
                hosts:
                  dvwa:
                    ansible_host: ${DVWA}
                  metasploitable:
                    ansible_host: ${META}
          EOF

      - name: Run Ansible Playbook
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_STDOUT_CALLBACK: "ansible.builtin.default"
          ANSIBLE_RESULT_FORMAT: "yaml"
        run: |
          ansible-playbook site.yml \
            -i inventory/hosts.yml \
            -v \
            --timeout 900

      - name: Deployment summary
        if: success()
        run: |
          echo "============================================================"
          echo "  SOC-as-Service - Deployment Complete"
          echo "============================================================"
          echo "  Wazuh Dashboard : https://${{ needs.terraform.outputs.wazuh_pub_ip }}"
          echo "  Bastion SSH     : ubuntu@${{ needs.terraform.outputs.bastion_ip }}"
          echo "  Wazuh login     : admin / (see wazuh-passwords.txt on server)"
          echo "============================================================"
