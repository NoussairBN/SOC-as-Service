name: "Shift-Left Security Scan"

on:
  # ⚠️ Scan désactivé sur push automatique (projet terminé)
  # Ce scan est exécuté automatiquement en Job 1 du pipeline deploy.yml
  # lors d'un déclenchement manuel (workflow_dispatch → apply/destroy)
  workflow_dispatch:

jobs:
  checkov:
    name: "Checkov — IaC Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true
          output_format: cli
          download_external_modules: true

  tfsec:
    name: "Tfsec — Terraform Security Scanner"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform/
          soft_fail: true
          format: lovely
