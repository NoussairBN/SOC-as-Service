---
# ============================================================
# roles/wazuh-agent/tasks/main.yml
# Installation et configuration de l'agent Wazuh
# Cibles : DVWA (dvwa-apache) + Metasploitable (VPC Client)
#
# FIXES APPLIQUÉS :
#   - wazuh_agent_name : utilise le nom défini en host_var
#     (dvwa-apache pour DVWA, inventory_hostname pour les autres)
#   - Suppression de client.keys avant agent-auth pour forcer
#     une ré-inscription propre et éviter les conflits de noms
#   - Nettoyage de l'entrée stale sur le manager avant inscription
# ============================================================

- name: "Agent | Install prerequisites"
  apt:
    name:
      - curl
      - gnupg
      - apt-transport-https
    state: present
    update_cache: yes

- name: "Agent | Check if already installed"
  stat:
    path: /var/ossec/bin/wazuh-agentd
  register: agent_installed

- name: "Agent | Add Wazuh GPG key"
  shell: |
    curl -s https://packages.wazuh.com/key/GPG-KEY-WAZUH | gpg --dearmor -o /usr/share/keyrings/wazuh.gpg
  args:
    creates: /usr/share/keyrings/wazuh.gpg
  when: not agent_installed.stat.exists

- name: "Agent | Add Wazuh repository"
  copy:
    content: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main"
    dest: /etc/apt/sources.list.d/wazuh.list
  when: not agent_installed.stat.exists

- name: "Agent | Install wazuh-agent (pointing to manager)"
  apt:
    name: wazuh-agent=4.11.2-1
    state: present
    update_cache: yes
    allow_downgrade: yes
  environment:
    WAZUH_MANAGER: "{{ wazuh_manager_ip }}"
    WAZUH_AGENT_NAME: "{{ wazuh_agent_name | default(inventory_hostname) }}"
  when: not agent_installed.stat.exists

- name: "Agent | Configure ossec.conf with manager address"
  template:
    src: ossec_agent.conf.j2
    dest: /var/ossec/etc/ossec.conf
    owner: root
    group: wazuh
    mode: '0640'
  notify: restart wazuh-agent

# -- Re-inscription propre ------------------------------------------
# PROBLEME IDENTIFIE : Wazuh 4.x a deux sources de verite :
#   1. client.keys (fichier texte, regenere depuis la DB)
#   2. agents.db   (SQLite, source autorite de wazuh-authd)
#
# Notre sed/manage_agents ne mettait a jour que client.keys.
# Sur les re-runs suivants, client.keys est deja propre donc
# grep ne trouve rien → agents.db n'est jamais nettoye.
#
# FIX DEFINITIF : interroger agents.db avec sqlite3 directement.

- name: "Agent | Remove stale agent from Wazuh SQLite DB (agents.db)"
  shell: |
    AGENT_NAME="{{ wazuh_agent_name | default(inventory_hostname) }}"
    DB="/var/ossec/var/db/agents.db"

    # Installer sqlite3 si necessaire
    if ! command -v sqlite3 >/dev/null 2>&1; then
      apt-get install -y sqlite3 -qq >/dev/null 2>&1 || true
    fi

    if command -v sqlite3 >/dev/null 2>&1 && [ -f "$DB" ]; then
      # Interroger la DB directement (independant de client.keys)
      AGENT_ID=$(sqlite3 "$DB" "SELECT id FROM agent WHERE name='$AGENT_NAME';" 2>/dev/null | head -1)
      if [ -n "$AGENT_ID" ]; then
        sqlite3 "$DB" "DELETE FROM agent WHERE id='$AGENT_ID';" 2>/dev/null || true
        sed -i "/^$AGENT_ID /d" /var/ossec/etc/client.keys 2>/dev/null || true
        echo "REMOVED $AGENT_NAME (ID: $AGENT_ID) from agents.db"
      else
        echo "No entry for $AGENT_NAME in agents.db — OK"
      fi
    else
      echo "sqlite3 not available - fallback to manage_agents"
      KEYS_FILE="/var/ossec/etc/client.keys"
      if grep -qw "$AGENT_NAME" "$KEYS_FILE" 2>/dev/null; then
        OLD_ID=$(grep -w "$AGENT_NAME" "$KEYS_FILE" | awk '{print $1}')
        /var/ossec/bin/manage_agents -r "$OLD_ID" 2>/dev/null || true
        sed -i "/^$OLD_ID /d" "$KEYS_FILE" 2>/dev/null || true
        echo "REMOVED $AGENT_NAME (ID: $OLD_ID) via manage_agents"
      fi
    fi
  args:
    executable: /bin/bash
  delegate_to: "{{ groups['soc'][0] }}"
  changed_when: false
  ignore_errors: true
  tags: [register]


- name: "Agent | Delete local client.keys to force fresh registration"
  file:
    path: /var/ossec/etc/client.keys
    state: absent
  ignore_errors: true
  tags: [register]

- name: "Agent | Register agent with manager (authd password)"
  shell: |
    /var/ossec/bin/agent-auth \
      -m {{ wazuh_manager_ip }} \
      -A {{ wazuh_agent_name | default(inventory_hostname) }} \
      -P pfs-soc-wazuh-2026
  register: agent_auth_result
  failed_when: agent_auth_result.rc != 0
  notify: restart wazuh-agent
  tags: [register]

- name: "Agent | Enable and start wazuh-agent service"
  service:
    name: wazuh-agent
    state: started
    enabled: yes

- name: "Agent | Wait for agent to connect to manager"
  pause:
    seconds: 15

- name: "Agent | Verify agent status"
  command: /var/ossec/bin/wazuh-control status
  register: agent_status
  changed_when: false

- name: "Agent | Show agent status"
  debug:
    var: agent_status.stdout_lines
