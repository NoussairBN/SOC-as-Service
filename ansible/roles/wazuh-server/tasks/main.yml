---
# ============================================================
# roles/wazuh-server/tasks/main.yml
# Installation Wazuh All-in-One (Manager + Indexer + Dashboard)
# Script officiel Wazuh 4.x
# ============================================================

- name: "Wazuh | Add swap space (requis pour Indexer sur 4GB RAM)"
  block:
    - name: Check if swap already exists
      command: swapon --show
      register: swap_check
      changed_when: false

    - name: Create 2GB swapfile
      command: fallocate -l 2G /swapfile
      when: swap_check.stdout == ""

    - name: Set swapfile permissions
      file:
        path: /swapfile
        mode: '0600'
      when: swap_check.stdout == ""

    - name: Format swapfile
      command: mkswap /swapfile
      when: swap_check.stdout == ""

    - name: Enable swap
      command: swapon /swapfile
      when: swap_check.stdout == ""

    - name: Persist swap in fstab
      lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        state: present

- name: "Wazuh | Kernel parameters for Indexer (OpenSearch)"
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { key: "vm.max_map_count", value: "262144" }
    - { key: "vm.swappiness",    value: "10" }

- name: "Wazuh | Install prerequisites"
  apt:
    name:
      - curl
      - apt-transport-https
      - gnupg
      - lsb-release
      - unzip
    state: present
    update_cache: yes

- name: "Wazuh | Check if already installed"
  stat:
    path: /var/ossec/bin/wazuh-control
  register: wazuh_installed

- name: "Wazuh | Download install script"
  get_url:
    url: https://packages.wazuh.com/4.11/wazuh-install.sh
    dest: /tmp/wazuh-install.sh
    mode: '0755'
  when: not wazuh_installed.stat.exists

- name: "Wazuh | Run all-in-one installer (10-15 min)"
  command: bash /tmp/wazuh-install.sh -a -i
  args:
    creates: /var/ossec/bin/wazuh-control
  async: 1200    # 20 min max
  poll: 30       # Check toutes les 30s
  when: not wazuh_installed.stat.exists
  register: wazuh_install_result

- name: "Wazuh | Ensure services are started"
  service:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - wazuh-manager
    - wazuh-indexer
    - wazuh-dashboard

- name: "Wazuh | Wait for Manager to be fully up"
  wait_for:
    port: 1514
    host: 0.0.0.0
    delay: 10
    timeout: 120

- name: "Wazuh | Wait for Dashboard to be ready"
  wait_for:
    port: 443
    host: 0.0.0.0
    delay: 15
    timeout: 180

- name: "Wazuh | Get admin password"
  command: tar -axf /tmp/wazuh-passwords.tar -O wazuh-install-files/wazuh-passwords.txt
  register: wazuh_passwords
  changed_when: false
  failed_when: false

- name: "Wazuh | Display credentials"
  debug:
    msg: |
      ╔══════════════════════════════════════════╗
      ║     WAZUH INSTALLATION COMPLETE          ║
      ║                                          ║
      ║  Dashboard: https://{{ ansible_host }}   ║
      ║  User: admin                             ║
      ║  Password: (see wazuh-passwords.txt)     ║
      ╚══════════════════════════════════════════╝

- name: "Wazuh | Configure manager for agent registration"
  lineinfile:
    path: /var/ossec/etc/ossec.conf
    regexp: '<use_password>no</use_password>'
    line: '    <use_password>yes</use_password>'
    backrefs: yes
  notify: restart wazuh-manager

- name: "Wazuh | Set agent registration password"
  copy:
    content: "pfs-soc-wazuh-2026"
    dest: /var/ossec/etc/authd.pass
    owner: root
    group: wazuh
    mode: '0640'
  notify: restart wazuh-manager

- name: "Wazuh | Enable File Integrity Monitoring on key paths"
  blockinfile:
    path: /var/ossec/etc/ossec.conf
    insertafter: '<syscheck>'
    marker: "<!-- {mark} ANSIBLE MANAGED FIM BLOCK -->"
    block: |
      <directories check_all="yes" realtime="yes">/etc,/usr/bin,/usr/sbin</directories>
      <directories check_all="yes" realtime="yes">/var/www,/home</directories>
  notify: restart wazuh-manager

- name: "Wazuh | Verify manager status"
  command: /var/ossec/bin/wazuh-control status
  register: wazuh_status
  changed_when: false
  failed_when: false   # wazuh-clusterd/maild optionnels retournent exit 1

- name: "Wazuh | Show status"
  debug:
    var: wazuh_status.stdout_lines

# ════════════════════════════════════════════════════════════
# UPGRADE SOC — Règles de détection custom + Active Response
# ════════════════════════════════════════════════════════════

- name: "SOC | Deploy custom detection rules"
  copy:
    src: custom_rules.xml
    dest: /var/ossec/etc/rules/custom_rules.xml
    owner: root
    group: wazuh
    mode: '0640'
  notify: restart wazuh-manager

- name: "SOC | Deploy Active Response configuration"
  blockinfile:
    path: /var/ossec/etc/ossec.conf
    insertbefore: '</ossec_config>'
    marker: "<!-- {mark} ANSIBLE MANAGED ACTIVE RESPONSE -->"
    block: |
      <!-- Active Response : blocage automatique IP -->
      <command>
        <name>firewall-drop</name>
        <executable>firewall-drop</executable>
        <timeout_allowed>yes</timeout_allowed>
      </command>

      <!-- Blocage SSH brute-force sévère (règle 100011 - 15+ failures) -->
      <active-response>
        <command>firewall-drop</command>
        <location>local</location>
        <rules_id>100011</rules_id>
        <timeout>3600</timeout>
      </active-response>

      <!-- Blocage brute-force standard Wazuh (5763) -->
      <active-response>
        <command>firewall-drop</command>
        <location>local</location>
        <rules_id>5763</rules_id>
        <timeout>1800</timeout>
      </active-response>

      <!-- Blocage reverse shell (critique - 24h) -->
      <active-response>
        <command>firewall-drop</command>
        <location>all</location>
        <rules_id>100042</rules_id>
        <timeout>86400</timeout>
      </active-response>
  notify: restart wazuh-manager

- name: "SOC | Enhanced FIM — Monitor critical paths with realtime"
  blockinfile:
    path: /var/ossec/etc/ossec.conf
    insertafter: '<syscheck>'
    marker: "<!-- {mark} ANSIBLE MANAGED ENHANCED FIM -->"
    block: |
      <!-- Fichiers critiques système -->
      <directories check_all="yes" realtime="yes" report_changes="yes">/etc/passwd,/etc/shadow,/etc/sudoers</directories>
      <directories check_all="yes" realtime="yes" report_changes="yes">/etc/cron.d,/var/spool/cron,/etc/crontab</directories>
      <directories check_all="yes" realtime="yes">/usr/bin,/usr/sbin,/bin,/sbin</directories>
      <directories check_all="yes" realtime="yes">/var/www,/srv/http,/opt</directories>
      <!-- Exclusions -->
      <ignore>/proc</ignore>
      <ignore>/sys</ignore>
      <ignore>/dev</ignore>
  notify: restart wazuh-manager

- name: "SOC | Configure log analysis for web attacks"
  blockinfile:
    path: /var/ossec/etc/ossec.conf
    insertafter: '</syscheck>'
    marker: "<!-- {mark} ANSIBLE MANAGED LOG ANALYSIS -->"
    block: |
      <!-- Analyse des logs Apache/Nginx pour détection web attacks -->
      <localfile>
        <log_format>apache</log_format>
        <location>/var/log/apache2/access.log</location>
      </localfile>
      <localfile>
        <log_format>apache</log_format>
        <location>/var/log/nginx/access.log</location>
      </localfile>
      <localfile>
        <log_format>syslog</log_format>
        <location>/var/log/auth.log</location>
      </localfile>
  notify: restart wazuh-manager

- name: "SOC | Verify custom rules syntax"
  command: /var/ossec/bin/wazuh-logtest -t
  register: rules_test
  changed_when: false
  failed_when: false

- name: "SOC | Show rules validation"
  debug:
    msg: |
      ╔══════════════════════════════════════════════════════╗
      ║     SOC UPGRADE COMPLETE                             ║
      ║                                                      ║
      ║  ✅ Custom rules deployed  (100001-100061)           ║
      ║  ✅ Active Response        (auto-block IP)           ║
      ║  ✅ Enhanced FIM           (realtime monitoring)     ║
      ║  ✅ Log analysis           (web + auth logs)         ║
      ║                                                      ║
      ║  Detected attacks:                                   ║
      ║    • SQL Injection / XSS / LFI                      ║
      ║    • SSH + Web Brute Force                           ║
      ║    • Privilege Escalation                            ║
      ║    • Port Scanning                                   ║
      ║    • Reverse Shells                                  ║
      ║    • DVWA-specific attacks                           ║
      ╚══════════════════════════════════════════════════════╝

