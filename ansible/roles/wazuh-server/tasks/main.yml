---
# ============================================================
# roles/wazuh-server/tasks/main.yml
# Installation Wazuh All-in-One (Manager + Indexer + Dashboard)
# Script officiel Wazuh 4.x
# ============================================================

- name: "Wazuh | Add swap space (requis pour Indexer sur 4GB RAM)"
  block:
    - name: Check if swap already exists
      command: swapon --show
      register: swap_check
      changed_when: false

    - name: Create 2GB swapfile
      command: fallocate -l 2G /swapfile
      when: swap_check.stdout == ""

    - name: Set swapfile permissions
      file:
        path: /swapfile
        mode: '0600'
      when: swap_check.stdout == ""

    - name: Format swapfile
      command: mkswap /swapfile
      when: swap_check.stdout == ""

    - name: Enable swap
      command: swapon /swapfile
      when: swap_check.stdout == ""

    - name: Persist swap in fstab
      lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        state: present

- name: "Wazuh | Kernel parameters for Indexer (OpenSearch)"
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { key: "vm.max_map_count", value: "262144" }
    - { key: "vm.swappiness",    value: "10" }

- name: "Wazuh | Install prerequisites"
  apt:
    name:
      - curl
      - apt-transport-https
      - gnupg
      - lsb-release
      - unzip
    state: present
    update_cache: yes

- name: "Wazuh | Check if already installed"
  stat:
    path: /var/ossec/bin/wazuh-control
  register: wazuh_installed

- name: "Wazuh | Download install script"
  get_url:
    url: https://packages.wazuh.com/4.11/wazuh-install.sh
    dest: /tmp/wazuh-install.sh
    mode: '0755'
  when: not wazuh_installed.stat.exists

- name: "Wazuh | Run all-in-one installer (10-15 min)"
  command: bash /tmp/wazuh-install.sh -a -i
  args:
    creates: /var/ossec/bin/wazuh-control
  async: 1200    # 20 min max
  poll: 30       # Check toutes les 30s
  when: not wazuh_installed.stat.exists
  register: wazuh_install_result

- name: "Wazuh | Ensure services are started"
  service:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - wazuh-manager
    - wazuh-indexer
    - wazuh-dashboard

- name: "Wazuh | Verify ossec.conf XML is valid"
  command: xmllint --noout /var/ossec/etc/ossec.conf
  register: xml_check
  changed_when: false
  failed_when: false

- name: "Wazuh | Restart manager if config is valid"
  service:
    name: wazuh-manager
    state: restarted
  when: xml_check.rc == 0

- name: "Wazuh | Wait for wazuh-remoted to be running"
  shell: /var/ossec/bin/wazuh-control status | grep 'wazuh-remoted is running'
  register: remoted_status
  retries: 12
  delay: 10
  until: remoted_status.rc == 0
  changed_when: false
  failed_when: false

- name: "Wazuh | Wait for Dashboard to be ready"
  wait_for:
    port: 443
    host: 0.0.0.0
    delay: 15
    timeout: 180

- name: "Wazuh | Get admin password"
  command: tar -axf /tmp/wazuh-passwords.tar -O wazuh-install-files/wazuh-passwords.txt
  register: wazuh_passwords
  changed_when: false
  failed_when: false

- name: "Wazuh | Display access information"
  debug:
    msg: |
      Wazuh installation complete.
      Dashboard : https://{{ ansible_host }}
      User      : admin
      Password  : see wazuh-passwords.txt on the server

- name: "Wazuh | Configure manager for agent registration"
  lineinfile:
    path: /var/ossec/etc/ossec.conf
    regexp: '<use_password>no</use_password>'
    line: '    <use_password>yes</use_password>'
    backrefs: yes
  notify: restart wazuh-manager

- name: "Wazuh | Set agent registration password"
  copy:
    content: "pfs-soc-wazuh-2026"
    dest: /var/ossec/etc/authd.pass
    owner: root
    group: wazuh
    mode: '0640'
  notify: restart wazuh-manager


- name: "Wazuh | Verify manager status"
  command: /var/ossec/bin/wazuh-control status
  register: wazuh_status
  changed_when: false
  failed_when: false   # wazuh-clusterd/maild optionnels retournent exit 1

- name: "Wazuh | Show status"
  debug:
    var: wazuh_status.stdout_lines

# ============================================================
# Custom detection rules and Active Response configuration
# ============================================================

- name: "SOC | Deploy custom detection rules"
  copy:
    src: custom_rules.xml
    dest: /var/ossec/etc/rules/custom_rules.xml
    owner: root
    group: wazuh
    mode: '0640'
  notify: restart wazuh-manager

# ── SOC Config Block (Active Response + FIM + Logs) ─────────
# Correction : le heredoc inline dans YAML causait une erreur
# "failed at splitting arguments" a cause des caracteres
# speciaux (fleches Unicode, quotes) dans le shell multi-ligne.
# Solution : stocker le bloc XML dans un fichier externe et
# l'appender via un simple shell one-liner.

- name: "SOC | Copy SOC configuration block to server"
  copy:
    src: soc_ossec_config.xml
    dest: /tmp/soc_ossec_config.xml
    mode: '0644'

- name: "SOC | Append SOC config block to ossec.conf (idempotent)"
  shell: >-
    if ! grep -q "ANSIBLE MANAGED SOC UPGRADE v3" /var/ossec/etc/ossec.conf;
    then cat /tmp/soc_ossec_config.xml >> /var/ossec/etc/ossec.conf && echo "SOC config block appended";
    else echo "SOC config already present - skipping"; fi
  args:
    executable: /bin/bash
  register: soc_config_result
  changed_when: "'SOC config block appended' in soc_config_result.stdout"
  notify: restart wazuh-manager


- name: "SOC | Verify custom rules syntax"
  command: /var/ossec/bin/wazuh-logtest -t
  register: rules_test
  changed_when: false
  failed_when: false

- name: "SOC | Show rules validation result"
  debug:
    msg: |
      SOC configuration complete.
      - Custom rules deployed  : IDs 100001-100043
      - Active Response        : firewall-drop (100011 SSH, 5763, 100043 CMDi)
      - Enhanced FIM           : real-time monitoring of /etc, cron, binaries
      - Log analysis           : auth.log (manager), dvwa-access.log (agents)
      Coverage: SQL Injection (100001/100006), XSS (100003 L12),
                LFI (100004 L11), SSH BF (100010/100011),
                OS Command Injection POST (100043 via if_sid=31108),
                Privilege Escalation (100020/100021), Persistence (100030/100031).

