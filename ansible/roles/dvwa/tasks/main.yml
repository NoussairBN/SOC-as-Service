---
# ============================================================
# roles/dvwa/tasks/main.yml
# Installation DVWA via Docker sur le subnet privé Client
#
# FIXES APPLIQUÉS :
#   - dvwa-log-forwarder.service : service systemd qui streame
#     les logs Apache du container Docker vers le host
#     (/var/log/dvwa-access.log).
#   - Sans ce service, le wazuh-agent ne peut pas lire les logs
#     Apache car ils sont DANS le container, pas sur le host.
# ============================================================

- name: "DVWA | Install Docker dependencies"
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes

- name: "DVWA | Add Docker GPG key"
  shell: |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: "DVWA | Add Docker repository"
  shell: |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
    https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
    > /etc/apt/sources.list.d/docker.list
  args:
    creates: /etc/apt/sources.list.d/docker.list

- name: "DVWA | Install Docker Engine"
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: "DVWA | Start and enable Docker"
  service:
    name: docker
    state: started
    enabled: yes

- name: "DVWA | Add ubuntu user to docker group"
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: "DVWA | Check if DVWA container is running"
  shell: docker ps --filter "name=dvwa" --format "{{ '{{' }}.Names{{ '}}' }}"
  register: dvwa_running
  changed_when: false

- name: "DVWA | Pull and run DVWA container"
  shell: |
    docker run -d \
      --name dvwa \
      --restart unless-stopped \
      -p 80:80 \
      vulnerables/web-dvwa
  when: "'dvwa' not in dvwa_running.stdout"

- name: "DVWA | Wait for DVWA to be ready"
  wait_for:
    port: 80
    host: 0.0.0.0
    delay: 10
    timeout: 120

- name: "DVWA | Configure weak SSH for brute-force demo"
  block:
    - name: Allow more SSH auth attempts (demo only)
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?MaxAuthTries"
        line: "MaxAuthTries 20"
      notify: restart sshd

    - name: Create demo user with weak password
      user:
        name: demouser
        password: "{{ 'password123' | password_hash('sha512') }}"
        shell: /bin/bash
        state: present

# ── Docker Log Forwarder ─────────────────────────────────────
# PROBLÈME : DVWA tourne dans Docker. Les logs Apache sont dans
#            le container (/var/log/apache2/access.log).
#            Le wazuh-agent sur le HOST ne peut pas les lire.
# SOLUTION : Service systemd qui tail les logs via docker exec
#            et les écrit sur le host dans /var/log/dvwa-access.log.
#            Le wazuh-agent monitore ce fichier (cf. ossec.conf.j2).

- name: "DVWA | Create log file for Apache access logs"
  file:
    path: /var/log/dvwa-access.log
    state: touch
    owner: root
    group: adm
    mode: '0644'
  changed_when: false

- name: "DVWA | Deploy dvwa-log-forwarder systemd service"
  copy:
    dest: /etc/systemd/system/dvwa-log-forwarder.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=DVWA Docker Apache Log Forwarder for Wazuh
      Documentation=https://github.com/NoussairBN/SOC-as-Service
      After=docker.service
      Requires=docker.service

      [Service]
      Type=simple
      Restart=always
      RestartSec=10
      # Attendre que le container dvwa soit UP avant de démarrer
      ExecStartPre=/bin/bash -c 'for i in $(seq 1 30); do docker ps | grep -q dvwa && exit 0; sleep 2; done; exit 1'
      # Streamer les logs Apache du container vers le fichier host
      ExecStart=/bin/bash -c 'docker exec dvwa tail -F /var/log/apache2/access.log >> /var/log/dvwa-access.log'
      # S'assurer que le fichier de log est accessible
      ExecStartPost=/bin/chmod 644 /var/log/dvwa-access.log

      [Install]
      WantedBy=multi-user.target
  notify: restart dvwa-log-forwarder

- name: "DVWA | Reload systemd daemon"
  systemd:
    daemon_reload: yes

- name: "DVWA | Enable and start dvwa-log-forwarder"
  service:
    name: dvwa-log-forwarder
    state: started
    enabled: yes

- name: "DVWA | Wait for log forwarder to populate log file"
  pause:
    seconds: 10

- name: "DVWA | Verify container status"
  shell: docker ps --filter "name=dvwa" --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}"
  register: dvwa_status
  changed_when: false

- name: "DVWA | Show container status"
  debug:
    var: dvwa_status.stdout_lines

- name: "DVWA | Verify log forwarder is active"
  shell: systemctl is-active dvwa-log-forwarder
  register: forwarder_status
  changed_when: false
  failed_when: false

- name: "DVWA | Show log forwarder status"
  debug:
    msg: "dvwa-log-forwarder: {{ forwarder_status.stdout }} | Log file: $(wc -l /var/log/dvwa-access.log 2>/dev/null)"
