---
# ============================================================
# ansible/site.yml -- Playbook Principal SOC-as-Code
# Ordre d'execution :
#   1. wazuh-server (manager doit etre UP avant les agents)
#   2. dvwa          (app vulnerable + cible brute-force)
#   3. wazuh-agent   (sur DVWA uniquement - cible principale)
# ============================================================

# -- PLAY 1 : Wazuh Server (VPC SOC) -------------------------
- name: "SOC | Install and configure Wazuh Server"
  hosts: soc
  become: yes
  gather_facts: yes

  roles:
    - role: wazuh-server
      tags: [wazuh, server, soc]

  post_tasks:
    - name: "Verify Wazuh Manager is listening on port 1514"
      wait_for:
        port: 1514
        host: 0.0.0.0
        timeout: 60
      tags: verify

# -- PLAY 2 : DVWA (VPC Client) ------------------------------
- name: "CLIENT | Install DVWA (vulnerable app)"
  hosts: dvwa
  become: yes
  gather_facts: yes

  roles:
    - role: dvwa
      tags: [dvwa, client]

  post_tasks:
    # Attendre que la machine se stabilise apres l'install Docker
    # + dvwa-log-forwarder avant d'ouvrir de nouvelles connexions SSH.
    # Sans ce delai, Play 3 obtient "Connection timed out" car la machine
    # est encore sous charge (Docker pull, container start, etc.)
    - name: "DVWA | Wait 30s for machine to stabilize before agent install"
      pause:
        seconds: 30
      tags: [dvwa, wait]

# -- PLAY 3 : Wazuh Agent DVWA (cible principale) -----------
# ignore_unreachable: true -> si dvwa est toujours sous charge,
# on ne fait pas echouer tout le pipeline.
# La tache de verification finale sur le manager confirme si
# l'agent s'est bien enregistre.
- name: "CLIENT | Deploy Wazuh Agent on DVWA"
  hosts: dvwa
  become: yes
  gather_facts: yes
  ignore_unreachable: true
  # wazuh_manager_ip vient des group_vars de l'inventaire (dynamique pipeline)

  roles:
    - role: wazuh-agent
      tags: [wazuh, agent, client]

  post_tasks:
    - name: "Confirm agents connected to manager"
      shell: /var/ossec/bin/agent_control -l
      register: agents_list
      delegate_to: "{{ groups['soc'][0] }}"
      changed_when: false
      failed_when: false
      run_once: true
      ignore_errors: true
      tags: verify

    - name: "Show registered agents"
      debug:
        var: agents_list.stdout_lines
      run_once: true
      ignore_errors: true
      tags: verify
