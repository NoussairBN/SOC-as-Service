---
# ============================================================
# ansible/site.yml -- Playbook Principal SOC-as-Code
# Ordre d'execution :
#   1. wazuh-server (manager doit etre UP avant les agents)
#   2. dvwa          (app vulnerable + cible brute-force)
#   3. wazuh-agent   (sur DVWA - cible principale de la demo)
# ============================================================

# -- PLAY 1 : Wazuh Server (VPC SOC) -------------------------
- name: "SOC | Install and configure Wazuh Server"
  hosts: soc
  become: yes
  gather_facts: no

  pre_tasks:
    - name: "SOC | Wait for SSH to be available on Wazuh server"
      wait_for_connection:
        timeout: 300
        delay: 5
        sleep: 15
    - name: "SOC | Gather facts"
      setup:

  roles:
    - role: wazuh-server
      tags: [wazuh, server, soc]

  post_tasks:
    - name: "Verify Wazuh Manager is listening on port 1514"
      wait_for:
        port: 1514
        host: 0.0.0.0
        timeout: 60
      tags: verify

# -- PLAY 2 : DVWA (VPC Client) ------------------------------
- name: "CLIENT | Install DVWA (vulnerable app)"
  hosts: dvwa
  become: yes
  gather_facts: no
  ignore_unreachable: true

  pre_tasks:
    # Attendre que la machine DVWA soit accessible avant de commencer.
    # Probleme observe : apres un premier run, Docker + log-forwarder
    # surchargent la machine et SSH ne repond plus immediatement.
    # wait_for_connection reessaie jusqu'a 5 minutes.
    - name: "DVWA | Wait for SSH to be available (up to 5 min)"
      wait_for_connection:
        timeout: 300
        delay: 10
        sleep: 15
    - name: "DVWA | Gather facts"
      setup:

  roles:
    - role: dvwa
      tags: [dvwa, client]

  post_tasks:
    # Attendre que la machine se stabilise apres l'install Docker
    # avant d'ouvrir de nouvelles connexions SSH (Play 3).
    - name: "DVWA | Wait 45s for machine to stabilize (Docker + log-forwarder)"
      pause:
        seconds: 45
      tags: [dvwa, wait]

# -- PLAY 3 : Wazuh Agent sur DVWA ---------------------------
- name: "CLIENT | Deploy Wazuh Agent on DVWA"
  hosts: dvwa
  become: yes
  gather_facts: no
  ignore_unreachable: true

  pre_tasks:
    - name: "Agent | Wait for SSH to be available after stabilization"
      wait_for_connection:
        timeout: 180
        delay: 5
        sleep: 10
    - name: "Agent | Gather facts"
      setup:

  roles:
    - role: wazuh-agent
      tags: [wazuh, agent, client]

  post_tasks:
    - name: "Confirm agents connected to manager"
      shell: /var/ossec/bin/agent_control -l
      register: agents_list
      delegate_to: "{{ groups['soc'][0] }}"
      changed_when: false
      failed_when: false
      run_once: true
      ignore_errors: true
      tags: verify

    - name: "Show registered agents"
      debug:
        var: agents_list.stdout_lines
      run_once: true
      ignore_errors: true
      tags: verify
