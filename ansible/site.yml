---
# ============================================================
# ansible/site.yml — Playbook Principal SOC-as-Code
# Ordre d'exécution :
#   1. wazuh-server (manager doit être UP avant les agents)
#   2. dvwa          (app vulnérable + cible brute-force)
#   3. wazuh-agent   (sur DVWA + Metasploitable)
# ============================================================

# ── PLAY 1 : Wazuh Server (VPC SOC) ─────────────────────────
- name: "SOC | Install and configure Wazuh Server"
  hosts: soc
  become: yes
  gather_facts: yes

  roles:
    - role: wazuh-server
      tags: [wazuh, server, soc]

  post_tasks:
    - name: "Verify Wazuh Manager is listening on port 1514"
      wait_for:
        port: 1514
        host: 0.0.0.0
        timeout: 60
      tags: verify

# ── PLAY 2 : DVWA (VPC Client — subnet privé) ───────────────
- name: "CLIENT | Install DVWA (vulnerable app)"
  hosts: dvwa
  become: yes
  gather_facts: yes

  roles:
    - role: dvwa
      tags: [dvwa, client]

# ── PLAY 3 : Wazuh Agents (DVWA + Metasploitable) ───────────
- name: "CLIENT | Deploy Wazuh Agents"
  hosts: client
  become: yes
  gather_facts: yes

  vars:
    wazuh_manager_ip: "10.1.1.109"

  roles:
    - role: wazuh-agent
      tags: [wazuh, agent, client]

  post_tasks:
    - name: "Confirm agent connected to manager"
      command: /var/ossec/bin/agent_control -l
      register: agents_list
      delegate_to: "{{ groups['soc'][0] }}"
      changed_when: false
      failed_when: false
      run_once: true
      tags: verify

    - name: "Show registered agents"
      debug:
        var: agents_list.stdout_lines
      run_once: true
      tags: verify
