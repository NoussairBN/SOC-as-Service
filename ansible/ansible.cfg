[defaults]
inventory          = inventory/hosts.yml
remote_user        = ubuntu
private_key_file   = ~/.ssh/pfs-soc-key
host_key_checking  = False
# Augmente le timeout SSH : le host dvwa est sous charge apres
# l'install Docker + dvwa-log-forwarder et peut mettre du temps
# a repondre aux nouvelles connexions SSH
timeout            = 120
forks              = 5
gathering          = smart
fact_caching       = memory

# Nouveau format yaml (ansible.core 2.11+ / community.general 12+)
stdout_callback    = ansible.builtin.default
result_format      = yaml
callbacks_enabled  = ansible.builtin.timer

[ssh_connection]
pipelining         = True
# ConnectTimeout=60 : delai max pour etablir la connexion via ProxyJump
# ServerAliveInterval=30 : keepalive pour eviter les coupures idle
# ServerAliveCountMax=10 : 10 keepalives avant de considerer le host mort
ssh_args           = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=60
# Retries automatiques en cas de connexion refusee (host sous charge)
retries            = 3
